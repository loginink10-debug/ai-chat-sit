<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>المساعد الذكي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cpath d='M28 34h44a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6H46l-12 10V66h-6a6 6 0 0 1-6-6V40a6 6 0 0 1 6-6z' fill='white'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e6e9f2;
    --brand:#6366f1;
    --brand-2:#06b6d4;
    --brand-soft:#eef0ff;
    --user-bubble:linear-gradient(135deg,#6366f1,#8b5cf6);
    --bot-bubble:#f4f6fb;
    --ok:#10b981;
    --danger:#ef4444;
    --radius:20px;
    --shadow:0 18px 50px -18px rgba(15,23,42,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI","Noto Kufi Arabic","Tahoma","Arial",system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 100% -10%, #e8ebff 0%, rgba(232,235,255,0) 60%),
      radial-gradient(900px 600px at -10% 110%, #e0f7fb 0%, rgba(224,247,251,0) 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:16px;
    gap:12px;
    max-width:980px;
    margin:0 auto;
  }

  /* ---------- الهيدر ---------- */
  header.top{
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 16px;
    box-shadow:0 6px 24px -18px rgba(15,23,42,.5);
  }
  .avatar{
    width:44px;height:44px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#fff;
    box-shadow:0 8px 20px -8px rgba(99,102,241,.8);
    position:relative;
  }
  .avatar svg{width:24px;height:24px}
  .brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .brand strong{font-size:16px;font-weight:800}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
  .dot.busy{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .spacer{flex:1}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer;
    transition:.18s ease; flex:0 0 auto;
  }
  .icon-btn:hover{color:var(--danger);border-color:#fecaca;background:#fff5f5}
  .icon-btn svg{width:18px;height:18px}

  /* ---------- منطقة المحادثة ---------- */
  main.chat{
    flex:1;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:6px 4px 4px;
    scroll-behavior:smooth;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  main.chat::-webkit-scrollbar{width:8px}
  main.chat::-webkit-scrollbar-thumb{background:#d7dbe8;border-radius:99px}

  .welcome{
    margin:auto;
    text-align:center;
    max-width:640px;
    padding:18px 10px 8px;
    animation:rise .45s ease both;
  }
  .welcome .big-avatar{
    width:78px;height:78px;border-radius:24px;margin:0 auto 16px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#fff;
    box-shadow:0 20px 40px -18px rgba(99,102,241,.95);
  }
  .welcome .big-avatar svg{width:40px;height:40px}
  .welcome h1{font-size:clamp(20px,3.2vw,27px);margin:0 0 8px;font-weight:800;letter-spacing:-.2px}
  .welcome p{margin:0 auto 20px;color:var(--muted);font-size:14.5px;line-height:1.85;max-width:520px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:10px 15px;border-radius:999px;font-size:13.5px;font-family:inherit;
    cursor:pointer;transition:.18s ease;box-shadow:0 2px 8px -6px rgba(15,23,42,.5);
  }
  .chip:hover{border-color:#c7ccff;background:var(--brand-soft);transform:translateY(-1px);color:#4338ca}

  .row{display:flex;gap:10px;align-items:flex-end;animation:rise .28s ease both}
  .row.me{justify-content:flex-start;flex-direction:row-reverse}
  .row.bot{justify-content:flex-end}
  .mini-avatar{
    width:30px;height:30px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  }
  .mini-avatar svg{width:16px;height:16px}
  .bubble{
    max-width:min(78%,660px);
    padding:12px 16px;
    border-radius:18px;
    font-size:14.8px;
    line-height:1.95;
    position:relative;
    word-wrap:break-word;
    overflow-wrap:anywhere;
  }
  .row.bot .bubble{
    background:var(--card);
    border:1px solid var(--line);
    border-bottom-right-radius:6px;
    box-shadow:0 8px 26px -20px rgba(15,23,42,.7);
  }
  .row.me .bubble{
    background:var(--user-bubble);
    color:#fff;
    border-bottom-left-radius:6px;
    box-shadow:0 10px 24px -14px rgba(99,102,241,.9);
  }
  .bubble p{margin:0 0 10px}
  .bubble p:last-child{margin-bottom:0}
  .bubble strong{font-weight:800}
  .bubble a{color:#4f46e5;text-decoration:underline;text-underline-offset:3px}
  .row.me .bubble a{color:#fff}
  .bubble ul,.bubble ol{margin:6px 0 10px;padding-inline-start:22px}
  .bubble li{margin:4px 0}
  .bubble h1,.bubble h2,.bubble h3{margin:12px 0 8px;line-height:1.5;font-size:1em}
  .bubble h1{font-size:1.18em}.bubble h2{font-size:1.1em}.bubble h3{font-size:1.03em}
  .bubble code{
    background:#eef1f8;color:#4338ca;padding:2px 6px;border-radius:6px;
    font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    direction:ltr;display:inline-block;
  }
  .row.me .bubble code{background:rgba(255,255,255,.22);color:#fff}
  .bubble pre{
    background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:12px;
    overflow-x:auto;direction:ltr;text-align:left;margin:8px 0 10px;font-size:12.8px;line-height:1.7;
  }
  .bubble pre code{background:none;color:inherit;padding:0;font-size:inherit}
  .bubble hr{border:none;border-top:1px solid var(--line);margin:12px 0}
  .copy{
    position:absolute;top:-11px;left:8px;opacity:0;transition:.18s ease;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    border-radius:8px;padding:3px 8px;font:inherit;font-size:11px;cursor:pointer;
    box-shadow:0 4px 12px -8px #0f172a;
  }
  .row.me .copy{display:none}
  .row.bot .bubble:hover .copy{opacity:1}
  .copy:hover{color:var(--brand)}

  /* مؤشر الكتابة */
  .typing{display:flex;gap:5px;align-items:center;height:20px;padding:2px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#a5b4fc;animation:blink 1.25s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  /* ---------- صندوق الكتابة ---------- */
  footer.composer{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:22px;
    padding:8px;
    box-shadow:var(--shadow);
  }
  .input-wrap{
    display:flex;align-items:flex-end;gap:8px;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 8px;
    transition:.18s ease;
  }
  .input-wrap:focus-within{border-color:#c7ccff;box-shadow:0 0 0 4px rgba(99,102,241,.1)}
  textarea{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    font:inherit;font-size:15px;line-height:1.8;padding:9px 6px;max-height:170px;min-height:44px;
    color:var(--ink);
  }
  textarea::placeholder{color:#9aa3b8}
  .send{
    width:42px;height:42px;border-radius:12px;border:none;flex:0 0 auto;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
    display:grid;place-items:center;transition:.18s ease;
    box-shadow:0 10px 22px -12px rgba(99,102,241,.95);
  }
  .send svg{width:20px;height:20px;transform:scaleX(-1)}
  .send:hover:not(:disabled){transform:translateY(-1px) scale(1.03)}
  .send:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .hint{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:6px 8px 2px;font-size:11.5px;color:#94a3b8;
  }
  .hint .kbd{
    border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;
    font-size:10.5px;background:#fff;direction:ltr;display:inline-block;
  }
  .err{
    align-self:center;background:#fff1f2;border:1px solid #fecdd3;color:#be123c;
    padding:10px 14px;border-radius:14px;font-size:13.5px;display:flex;gap:8px;align-items:center;
    max-width:90%;animation:rise .25s ease both;
  }
  .err button{
    border:none;background:#be123c;color:#fff;border-radius:8px;padding:5px 10px;
    font:inherit;font-size:12px;cursor:pointer;flex:0 0 auto;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- وضع التضمين داخل ويدجت (?embed=1) ---------- */
  body.embed .app{padding:0;gap:0;max-width:none;height:100dvh}
  body.embed header.top{display:none}
  body.embed main.chat{padding:12px 10px 6px}
  body.embed footer.composer{
    border-radius:0;border:none;border-top:1px solid var(--line);
    box-shadow:0 -6px 20px -18px rgba(15,23,42,.6);background:#fff;padding:8px 10px 10px;
  }
  body.embed .hint{display:none}
  body.embed .welcome{padding-top:14px}
  body.embed .welcome .big-avatar{width:58px;height:58px;border-radius:18px;margin-bottom:12px}
  body.embed .welcome .big-avatar svg{width:29px;height:29px}
  body.embed .welcome h1{font-size:19px}
  body.embed .welcome p{font-size:13px;margin-bottom:14px}
  body.embed .chip{font-size:12.5px;padding:8px 12px}
  body.embed .bubble{max-width:88%;font-size:14px}

  @media (max-width:640px){
    .app{padding:10px;gap:9px}
    header.top{padding:10px 12px;border-radius:16px}
    .bubble{max-width:86%;font-size:14.4px}
    .welcome .big-avatar{width:66px;height:66px}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <div class="brand">
      <strong id="botName">المساعد الذكي</strong>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">متصل · جاهز للرد</span></div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clearBtn" title="محادثة جديدة" aria-label="محادثة جديدة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>
      </svg>
    </button>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <footer class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا…" aria-label="رسالتك"></textarea>
      <button class="send" id="sendBtn" title="إرسال" aria-label="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
    <div class="hint">
      <span><span class="kbd">Enter</span> للإرسال · <span class="kbd">Shift + Enter</span> لسطر جديد</span>
      <span id="providerTag"></span>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';

  // وضع التضمين: الصفحة جوه بانل الويدجت
  try {
    if (new URLSearchParams(location.search).get('embed')) {
      document.body.classList.add('embed');
    }
  } catch {}

  const chatEl   = document.getElementById('chat');
  const inputEl  = document.getElementById('input');
  const sendBtn  = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');
  const dotEl    = document.getElementById('statusDot');
  const statusEl = document.getElementById('statusText');
  const nameEl   = document.getElementById('botName');
  const provEl   = document.getElementById('providerTag');

  const BOT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;

  const DEFAULTS = {
    botName: 'المساعد الذكي',
    greeting: 'أهلاً بيك 👋 أنا المساعد الذكي بتاع الموقع. اسألني في أي حاجة وأنا هساعدك على طول.',
    suggestions: ['إنت بتقدم إيه بالظبط؟', 'إزاي أقدر أبدأ؟', 'إيه المميزات المتاحة؟', 'أتواصل معاكم إزاي؟']
  };

  let settings = { ...DEFAULTS };
  let history = [];          // [{role:'user'|'assistant', content:string}]
  let busy = false;

  /* ---------------------------- أدوات مساعدة ---------------------------- */

  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);

  /** رندر ماركداون بسيط وآمن (بنعمل escape الأول) */
  function renderMarkdown(src) {
    let text = String(src || '').replace(/\r\n/g, '\n');

    // نفصل بلوكات الكود الأول
    const blocks = [];
    text = text.replace(/```([a-zA-Z0-9+#._-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const i = blocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`) - 1;
      return `\u0000BLOCK${i}\u0000`;
    });

    text = escapeHtml(text);

    // كود إنلاين
    text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // عناوين
    text = text.replace(/^######\s+(.*)$/gm, '<h3>$1</h3>')
               .replace(/^#{1,3}\s+(.*)$/gm, '<h3>$1</h3>');

    // خط عريض / مائل / مشطوب
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
               .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
               .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?؛:]|$)/g, '$1<em>$2</em>')
               .replace(/~~([^~\n]+)~~/g, '<s>$1</s>');

    // روابط
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/(^|[\s])((https?:\/\/)[^\s<]+)/g,
      (m, pre, url) => pre + `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);

    // فاصل
    text = text.replace(/^\s*([-*_])\1{2,}\s*$/gm, '<hr>');

    // قوائم + فقرات (سطر بسطر)
    const lines = text.split('\n');
    let out = '', listType = null;
    const closeList = () => { if (listType) { out += `</${listType}>`; listType = null; } };

    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { closeList(); continue; }
      if (/^\u0000BLOCK\d+\u0000$/.test(line)) { closeList(); out += line; continue; }
      if (/^<(h3|hr)[\s>]/.test(line)) { closeList(); out += line; continue; }

      let m = line.match(/^[-*•]\s+(.*)$/);
      if (m) {
        if (listType !== 'ul') { closeList(); out += '<ul>'; listType = 'ul'; }
        out += `<li>${m[1]}</li>`;
        continue;
      }
      m = line.match(/^(\d+)[.)]\s+(.*)$/);
      if (m) {
        if (listType !== 'ol') { closeList(); out += '<ol>'; listType = 'ol'; }
        out += `<li>${m[2]}</li>`;
        continue;
      }
      closeList();
      out += `<p>${line}</p>`;
    }
    closeList();

    return out.replace(/\u0000BLOCK(\d+)\u0000/g, (_, i) => blocks[Number(i)] || '');
  }

  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 170) + 'px';
  }

  function scrollDown(force = false) {
    const nearBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 160;
    if (force || nearBottom) {
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  }

  function setStatus(text, state) {
    statusEl.textContent = text;
    dotEl.className = 'dot' + (state ? ' ' + state : '');
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    setStatus(v ? 'بيكتب…' : 'متصل · جاهز للرد', v ? 'busy' : '');
  }

  /* ---------------------------- عرض الرسائل ---------------------------- */

  function addMessage(role, content) {
    const row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'me' : 'bot');

    const av = document.createElement('div');
    av.className = 'mini-avatar';
    av.innerHTML = role === 'user'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
      : BOT_ICON;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(content);

    if (role !== 'user') {
      const copy = document.createElement('button');
      copy.className = 'copy';
      copy.type = 'button';
      copy.textContent = 'نسخ';
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(content);
          copy.textContent = 'تم النسخ ✓';
        } catch {
          copy.textContent = 'مش قادر أنسخ';
        }
        setTimeout(() => (copy.textContent = 'نسخ'), 1500);
      };
      bubble.appendChild(copy);
    }

    row.appendChild(av);
    row.appendChild(bubble);
    chatEl.appendChild(row);
    scrollDown(true);
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typingRow';
    row.innerHTML = `<div class="mini-avatar">${BOT_ICON}</div>
      <div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
    chatEl.appendChild(row);
    scrollDown(true);
  }

  function removeTyping() {
    const t = document.getElementById('typingRow');
    if (t) t.remove();
  }

  function addError(msg, retryText) {
    const box = document.createElement('div');
    box.className = 'err';
    const span = document.createElement('span');
    span.textContent = '⚠️ ' + msg;
    box.appendChild(span);
    if (retryText) {
      const btn = document.createElement('button');
      btn.textContent = 'حاول تاني';
      btn.onclick = () => { box.remove(); retryText(); };
      box.appendChild(btn);
    }
    chatEl.appendChild(box);
    scrollDown(true);
  }

  /* ---------------------------- شاشة الترحيب ---------------------------- */

  function showWelcome() {
    chatEl.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = `
      <div class="big-avatar">${BOT_ICON}</div>
      <h1>${escapeHtml(settings.botName || DEFAULTS.botName)}</h1>
      <p>${escapeHtml(settings.greeting || DEFAULTS.greeting)}</p>
      <div class="chips"></div>`;
    const chips = w.querySelector('.chips');
    (settings.suggestions && settings.suggestions.length ? settings.suggestions : DEFAULTS.suggestions)
      .forEach((s) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = s;
        b.onclick = () => send(s);
        chips.appendChild(b);
      });
    chatEl.appendChild(w);
  }

  /* ---------------------------- الإرسال ---------------------------- */

  async function send(text) {
    const content = String(text == null ? inputEl.value : text).trim();
    if (!content || busy) return;

    // لو دي أول رسالة، نشيل شاشة الترحيب
    const welcome = chatEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    inputEl.value = '';
    autoGrow();

    history.push({ role: 'user', content });
    addMessage('user', content);

    setBusy(true);
    addTyping();

    const payload = { messages: history.slice(-20) };

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      });

      let data = {};
      try { data = await res.json(); } catch {}

      removeTyping();

      if (!res.ok) {
        const msg = data.error || 'حصل خطأ في الاتصال. جرب تاني.';
        addError(msg, () => send(content));
        setBusy(false);
        return;
      }

      const reply = (data.reply || '').trim() || 'معلش، مقدرتش أجهّز رد. جرب تسألني بطريقة تانية.';
      history.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);
    } catch (e) {
      removeTyping();
      addError('مش قادر أوصل للسيرفر. اتأكد إن النت شغّال وإن السيرفر بيشتغل.', () => send(content));
    } finally {
      setBusy(false);
      saveSession();
      inputEl.focus();
    }
  }

  /* ---------------------------- حفظ مؤقت للمحادثة ---------------------------- */

  function saveSession() {
    try {
      sessionStorage.setItem('chat-history', JSON.stringify(history.slice(-40)));
    } catch {}
  }

  function restoreSession() {
    try {
      const raw = sessionStorage.getItem('chat-history');
      if (!raw) return false;
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return false;
      history = arr.filter((m) => m && (m.role === 'user' || m.role === 'assistant') && m.content);
      if (!history.length) return false;
      chatEl.innerHTML = '';
      history.forEach((m) => addMessage(m.role, m.content));
      scrollDown(true);
      return true;
    } catch { return false; }
  }

  /* ---------------------------- الأحداث ---------------------------- */

  inputEl.addEventListener('input', autoGrow);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', () => send());

  clearBtn.addEventListener('click', () => {
    history = [];
    try { sessionStorage.removeItem('chat-history'); } catch {}
    showWelcome();
    inputEl.focus();
    setStatus('متصل · جاهز للرد', '');
  });

  /* ---------------------------- الإقلاع ---------------------------- */

  (async function boot() {
    try {
      const res = await fetch('/api/config', { headers: { accept: 'application/json' } });
      if (res.ok) {
        const c = await res.json();
        settings = { ...DEFAULTS, ...c };
        if (settings.botName) {
          nameEl.textContent = settings.botName;
          document.title = settings.botName;
        }
        if (settings.provider) provEl.textContent = settings.provider;
      }
    } catch {}
    if (!restoreSession()) showWelcome();
    inputEl.focus();
  })();
})();
</script>
</body>
</html>
