# ملف جاهز للنشر على Render بضغطة واحدة
# (Render → New → Blueprint → اختار المستودع)
services:
  - type: web
    name: ai-chat-site
    runtime: node
    plan: free
    buildCommand: "echo no-build-needed"
    startCommand: "node server.js"
    envVars:
      - key: LLM_PROVIDER
        value: pollinations      # غيّرها لـ openai أو gemini لما تحط مفتاحك
      - key: LLM_API_KEY
        sync: false              # هتحطها من لوحة Render (سرّية)
      - key: LLM_MODEL
        sync: false
      - key: BOT_NAME
        value: مساعد الموقع
      - key: MAX_MESSAGES_PER_MINUTE
        value: "20"
